plugins {
    id "com.android.application"
}

android {
    namespace "io.github.gt7timetrials"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.gt7timetrials"
        minSdk 29
        targetSdk 36
        // each GitHub Actions build gets a higher number, so a new APK installs over the old one
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        buildConfigField "String", "SITE", '"https://gt7-timetrials.github.io/"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // the key for the APKs on the release pages (the test and beta apps), so each build installs over the last:
        // private, GitHub Actions writes it from the repository's secrets. Without it (a build on a computer), they're
        // signed with the computer's own debug key.
        if (System.getenv("TEST_KEYSTORE")) {
            test {
                storeFile file(System.getenv("TEST_KEYSTORE"))
                storePassword System.getenv("TEST_KEYSTORE_PASSWORD")
                keyAlias "test"
                keyPassword System.getenv("TEST_KEYSTORE_PASSWORD")
            }
        }
        // the private Google Play upload key: GitHub Actions writes it from the repository's secrets
        if (System.getenv("UPLOAD_KEYSTORE")) {
            upload {
                storeFile file(System.getenv("UPLOAD_KEYSTORE"))
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("TEST_KEYSTORE") ? signingConfigs.test : signingConfigs.debug
        }
        // the beta app ("gradle assembleBeta"): installs next to the Play app, under its own name and app ID, and shows
        // the beta website (built from the beta branch), for trying changes before testers get them
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            buildConfigField "String", "SITE", '"https://gt7-timetrials.github.io/beta/"'
            signingConfig System.getenv("TEST_KEYSTORE") ? signingConfigs.test : signingConfigs.debug
        }
        // for Google Play: "gradle bundlePlay" makes the app bundle (.aab), signed with the upload key
        play {
            initWith release
            signingConfig System.getenv("UPLOAD_KEYSTORE") ? signingConfigs.upload : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
