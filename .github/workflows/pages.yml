name: Publish website

# Builds the website from main, plus the beta website at /beta/ from the beta branch (with main's data), and
# publishes both. A push to beta starts this from main (see beta.yml), so only main ever deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m gt7tt site --out _site
      - name: Check out the beta branch, if there is one
        id: beta
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null; then
            git fetch --depth 1 origin beta
            git worktree add beta-src FETCH_HEAD
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the beta website at /beta/
        if: steps.beta.outputs.found == 'true'
        working-directory: beta-src
        env:
          GT7_DATA: ${{ github.workspace }}/data
        run: |
          python -m gt7tt site --out ../_site/beta
          # keep it out of search engines, and make it obvious it's the beta
          sed -i 's|<head>|<head>\n<meta name="robots" content="noindex">|; s|<body>|<body>\n<div class="beta-bar">Beta: work in progress, for testing. <a href="../">Go to the main site</a></div>|' ../_site/beta/index.html
          printf '.beta-bar { background: #fff3cd; color: #5c4400; padding: 6px 16px; font-size: 0.9rem; }\n.beta-bar a { color: inherit; }\n' >> ../_site/beta/style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
