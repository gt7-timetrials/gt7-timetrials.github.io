name: Beta website

# A push to the beta branch republishes the website (main at the root, beta at /beta/). The publishing workflow runs
# from main, because only main may deploy to GitHub Pages.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
